name: guitar_rig
description: "A guitar multi-effect application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1   # ⭐ AGGIUNTO

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true    # ⭐ AGGIUNTO

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/guitar_test.mp3
