workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS IPA (unsigned)
        script: |
          flutter build ios --release --no-codesign
          # Creazione manuale di una cartella Payload per "impacchettare" l'IPA
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r unsigned_app.ipa Payload

    artifacts:
      - build/ios/iphoneos/*.ipa

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com