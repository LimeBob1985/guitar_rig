workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS IPA (unsigned)
        script: |
          # 1. Pulizia e Build
          flutter build ios --release --no-codesign
          
          # 2. Preparazione cartella Payload
          # Ci spostiamo nella directory dove Flutter genera il bundle .app
          cd build/ios/iphoneos
          
          # Rimuoviamo eventuali residui e creiamo la cartella Payload
          rm -rf Payload
          mkdir -p Payload
          
          # 3. Copia del bundle .app dentro Payload
          cp -r Runner.app Payload/
          
          # 4. Creazione dell'IPA
          # È fondamentale usare 'zip -r' stando dentro la cartella iphoneos
          # in modo che 'Payload' sia nella root del file .ipa
          zip -r unsigned_app.ipa Payload
          
    artifacts:
      - build/ios/iphoneos/unsigned_app.ipa

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com