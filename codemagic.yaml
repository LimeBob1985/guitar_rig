workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod install
          cd ..

      - name: Build for Real Device (ARM64)
        script: |
          # Questo comando è fondamentale: compila per il processore dell'iPhone
          flutter build ios --release --no-codesign --sdk iphoneos

      - name: Export IPA manually
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          PAYLOAD_PATH="build/ios/iphoneos/Payload"
          IPA_NAME="guitar_rig.ipa"
          OUTPUT_DIR="build/ios/ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app non trovato!"
            exit 1
          fi

          # Vedrai il peso reale nei log di Codemagic
          echo "📏 Peso bundle: $(du -sh "$APP_PATH")"

          rm -rf "$PAYLOAD_PATH"
          mkdir -p "$PAYLOAD_PATH"
          cp -r "$APP_PATH" "$PAYLOAD_PATH/"

          # Compressione con mantenimento link simbolici (-y)
          cd build/ios/iphoneos
          zip -r -y "$IPA_NAME" Payload
          cd ../../..

          mkdir -p "$OUTPUT_DIR"
          mv "build/ios/iphoneos/$IPA_NAME" "$OUTPUT_DIR/"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com