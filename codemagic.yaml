workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest # Qui Codemagic userà il suo Mac per te

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Prepare iOS Pods (Cruciale per chi non ha Mac)
        script: |
          cd ios
          # Eliminiamo eventuali residui corrotti caricati da Windows
          rm -rf Pods
          rm -f Podfile.lock
          # Forza l'installazione delle librerie native (come audioplayers)
          pod install
          cd ..

      - name: Build iOS IPA (unsigned)
        script: |
          # 1. Build dell'applicazione
          flutter build ios --release --no-codesign
          
          # 2. Struttura Payload per SideStore/AltStore
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r unsigned_app.ipa Payload
          
          # 3. Spostamento nella root per il recupero
          mv unsigned_app.ipa ../../../unsigned_app.ipa

    artifacts:
      - "*.ipa"

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com