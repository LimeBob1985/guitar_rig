workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS IPA (unsigned)
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.ipa
      - build/ios/**/*.ipa

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com
