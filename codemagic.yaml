workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod install
          cd ..

      - name: Build IPA (correct method)
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      # Questo percorso è più preciso per il comando "build ipa"
      - build/ios/archive/*.xcarchive
      - build/ios/ipa/*.ipa
      # Percorso di fallback universale se i precedenti falliscono
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.ipa

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com