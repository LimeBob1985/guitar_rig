workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS IPA (unsigned)
        script: |
          # 1. Build dell'applicazione (Codemagic farà pod install da solo)
          flutter build ios --release --no-codesign
          
          # 2. Struttura Payload per SideStore/AltStore
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r unsigned_app.ipa Payload
          
          # 3. Spostamento nella root per il recupero
          mv unsigned_app.ipa ../../../unsigned_app.ipa

    artifacts:
      - "unsigned_app.ipa"

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com
