workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod install
          cd ..

      - name: Build archive
        script: |
          flutter build ios --release --no-codesign

      - name: Export IPA manually
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com
