workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod install
          cd ..

      - name: Build archive
        script: |
          flutter build ios --release --no-codesign

      - name: Export IPA manually
        script: |
          # Trova automaticamente il .xcarchive ovunque Flutter lo metta
          ARCHIVE_PATH=$(find build/ios -name "*.xcarchive" | head -n 1)

          if [ -z "$ARCHIVE_PATH" ]; then
            echo "❌ Nessun archivio trovato. Flutter non ha generato lo .xcarchive."
            exit 1
          fi

          echo "📦 Archivio trovato: $ARCHIVE_PATH"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com
