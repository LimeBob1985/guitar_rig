workflows:
  ios-ipa:
    name: "Build iOS IPA (unsigned)"
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS IPA (unsigned)
        script: |
          # 1. Build dell'applicazione
          flutter build ios --release --no-codesign
          
          # 2. Spostamento nella cartella di output
          cd build/ios/iphoneos
          
          # 3. Pulizia e creazione struttura Payload per SideStore
          rm -rf Payload
          mkdir -p Payload
          
          # 4. Copia di qualsiasi file .app generato (più sicuro di Runner.app)
          cp -r *.app Payload/
          
          # 5. Compressione in formato IPA
          zip -r unsigned_app.ipa Payload
          
          # 6. Spostamento del file nella root del progetto per facilitare il recupero
          mv unsigned_app.ipa ../../../unsigned_app.ipa

    artifacts:
      - "*.ipa"

    publishing:
      email:
        recipients:
          - robyalaimo85@gmail.com